<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b4332"/>
      <stop offset="50%" style="stop-color:#2d6a4f"/>
      <stop offset="100%" style="stop-color:#40916c"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#52b788"/>
      <stop offset="100%" style="stop-color:#95d5b2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Decorative leaves -->
  <ellipse cx="80" cy="220" rx="60" ry="30" fill="url(#leaf)" opacity="0.3" transform="rotate(-30 80 220)"/>
  <ellipse cx="320" cy="180" rx="50" ry="25" fill="url(#leaf)" opacity="0.25" transform="rotate(20 320 180)"/>
  <ellipse cx="200" cy="250" rx="80" ry="35" fill="url(#leaf)" opacity="0.2"/>
  <!-- Central leaf icon -->
  <path d="M200 80 C160 80 140 120 140 150 C140 190 170 220 200 220 C230 220 260 190 260 150 C260 120 240 80 200 80 Z" fill="url(#leaf)" opacity="0.6"/>
  <path d="M200 100 L200 200 M170 130 Q200 115 230 130 M170 165 Q200 150 230 165" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Herb sprigs -->
  <circle cx="100" cy="100" r="8" fill="#95d5b2" opacity="0.4"/>
  <circle cx="300" cy="90" r="6" fill="#b08968" opacity="0.4"/>
  <circle cx="150" cy="60" r="5" fill="#ddb892" opacity="0.3"/>
</svg>
