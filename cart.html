<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Review your selected herbal products and place your order through WhatsApp."
    />
    <title>Cart | Sri Herbal Care</title>
    <link
      rel="icon"
      href="./assets/logo-1-removebg-preview.png"
      type="image/svg+xml"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div id="loading-screen" class="loading-screen">
      <img
        src="./assets/logo-1-removebg-preview.png"
        alt="Leya Organics"
        class="loading-logo"
      />
      <div class="loading-spinner"></div>
      <p class="loading-text">Leya Organics</p>
    </div>

    <nav class="navbar" role="navigation" aria-label="Main navigation">
      <div class="container">
        <a href="index.html" class="navbar-brand">
          <img
            src="./assets/logo-1-removebg-preview.png"
            alt="Leya Organics Logo"
            class="navbar-logo"
          />
          <span class="navbar-brand-text">Leya <span>Organics</span></span>
        </a>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="products.html" class="nav-link">Products</a></li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>
        <div class="nav-actions">
          <button
            id="dark-mode-toggle"
            class="nav-icon-btn"
            aria-label="Toggle dark mode"
          >
            🌙
          </button>
          <a href="login.html" class="nav-icon-btn" aria-label="Admin Login"
            >👤</a
          >
          <button class="hamburger" aria-label="Toggle menu">
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
    </nav>

    <main class="section cart-page">
      <div class="container">
        <div class="cart-page-header">
          <h1>Your Cart</h1>
          <p>
            Review your selected herbal products and place your order in one
            click.
          </p>
        </div>
        <div class="cart-layout">
          <div id="cart-items" class="cart-items-panel"></div>
          <div id="cart-summary"></div>
        </div>
      </div>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
